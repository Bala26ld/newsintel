[project]
name = "newsintel"
version = "0.1.0"
description = "Market-moving news intelligence platform: evidence-first detection, verification and alerting for IN/UK/US official sources."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "sse-starlette>=2.1",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "redis>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "psycopg[binary]>=3.1"]
providers = ["anthropic>=0.30", "openai>=1.30", "google-genai>=1.0"]

[project.scripts]
newsintel = "newsintel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsintel*"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # FastAPI Depends/Body; long regex and f-string lines

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
